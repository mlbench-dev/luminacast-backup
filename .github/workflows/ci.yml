name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luminacast_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/orchestrator
        run: |
          pip install -r requirements-ci.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run unit tests
        working-directory: backend/orchestrator
        run: python -m pytest tests/unit/ -v --tb=short --junitxml=../../test-results/unit.xml
        env:
          APP_ENV: test
          APP_SECRET_KEY: test_secret_key_for_ci

      - name: Run integration tests
        working-directory: backend/orchestrator
        continue-on-error: true
        run: python -m pytest tests/integration/ -v --tb=short --junitxml=../../test-results/integration.xml
        env:
          APP_ENV: test
          APP_SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5433/luminacast_test
          REDIS_URL: redis://localhost:6380/0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/

  frontend-lint-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/companion-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/companion-app
        run: npm ci

      - name: Type check
        working-directory: frontend/companion-app
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: frontend/companion-app
        run: npx vitest run --reporter=junit --outputFile=../../test-results/frontend-unit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: frontend/companion-app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend/companion-app
        run: npx playwright test
        env:
          VITE_API_URL: http://localhost:8000/api
          VITE_WS_URL: ws://localhost:8000/ws

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/companion-app/playwright-report/

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 145.223.121.28
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /opt/luminacast-omni
            git pull origin main
            docker compose build
            docker compose down --remove-orphans || true
            docker compose up -d --force-recreate
            sleep 10
            docker compose exec -T orchestrator alembic upgrade head
            docker compose exec -T orchestrator python scripts/create_admin.py || true
            echo "Deployed at $(date)"
