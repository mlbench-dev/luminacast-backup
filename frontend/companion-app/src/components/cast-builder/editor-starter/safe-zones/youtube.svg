<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <!-- YouTube 16:9 safe zone overlay -->
  <!-- Top: progress bar + title + info bar -->
  <rect x="0" y="0" width="1920" height="80" fill="rgba(255,0,0,0.12)"/>
  <text x="20" y="30" fill="rgba(255,0,0,0.6)" font-size="24" font-family="sans-serif">YouTube</text>
  <!-- Right: recommended sidebar (minimode in theater) -->
  <rect x="1540" y="80" width="380" height="860" fill="rgba(255,0,0,0.08)"/>
  <!-- Bottom: controls bar (play, volume, progress, settings, fullscreen) -->
  <rect x="0" y="1000" width="1920" height="80" fill="rgba(255,0,0,0.12)"/>
  <!-- Safe content area border -->
  <rect x="40" y="92" width="1480" height="896" stroke="rgba(255,0,0,0.35)" stroke-width="2" stroke-dasharray="8 4" fill="none" rx="4"/>
</svg>
